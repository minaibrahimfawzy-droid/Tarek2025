yaml
name: Build Windows Installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer
        run: npm run dist

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Tarek2025-Windows-Installer
          path: dist/*-Setup-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" dist/*-Setup-*.exe --title "نظام متابعة الطرق والقطاعات ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
